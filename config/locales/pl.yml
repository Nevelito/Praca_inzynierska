  pages:
    home:
      welcome_in: "Witaj w <span class='font-bold'> newSAVEel </span>, Twoim niezastąpionym narzędziu do zarządzania miesięcznymi wydatkami i organizowania dnia. Nasza aplikacja została stworzona z myślą o osobach, które chcą lepiej kontrolować swoje finanse i efektywniej planować swój czas. Dzięki intuicyjnemu interfejsowi i zaawansowanym funkcjom, zarządzanie budżetem i harmonogramem staje się łatwe i przyjemne."
      name: "newSAVEel"
      save_money: "Aplikacja pomoże Ci zarządzać swoimi finansami. Możesz łatwo dodawać swoje wydatki i oszczędności oraz śledzić swoje postępy w oszczędzaniu. Aplikacja będzie monitorować i wizualizować Twoje codzienne finanse, pomagając Ci osiągnąć Twoje cele oszczędnościowe."
      goals: "Ustawiaj i monitoruj swoje cele finansowe, takie jak oszczędności na wakacje czy fundusz awaryjny. Śledź postępy i otrzymuj przypomnienia, aby łatwiej osiągnąć swoje finansowe marzenia."
      currency: "Sprawdzaj aktualne kursy walut i korzystaj z wbudowanego kalkulatora do szybkiego przeliczania między walutami. Bądź na bieżąco i podejmuj lepsze decyzje finansowe, niezależnie od miejsca i czasu."
      heading_save_money: "Zaoszczędź swoje pieniądze"
